database:
  connection_pool_size: 10
  host: localhost
  name: asi_arch_research
  password: ''
  port: 5432
  user: postgres
debug: false
evaluation:
  batch_size: 16
  benchmarks:
  - arc_challenge
  - arc_easy
  - boolq
  - hellaswag
  - piqa
  - social_iqa
  - winogrande
  - lambada_openai
  few_shot_examples: 0
  max_samples: null
evolution:
  crossover_rate: 0.3
  diversity_threshold: 0.8
  elite_size: 10
  fitness_weights:
    efficiency: 0.2
    novelty: 0.1
    performance: 0.7
  mutation_rate: 0.1
  population_size: 50
experiment_name: null
llm:
  api_key: ***REMOVED***
  max_tokens: 4000
  model: claude-3-sonnet-20240229
  provider: anthropic
  temperature: 0.7
monitoring:
  checkpoint_dir: ./checkpoints
  log_level: INFO
  save_artifacts: true
  use_wandb: true
  wandb_entity: null
  wandb_project: xpyllment
multimedia:
  enable_paper_processing: false
  enable_video_generation: false
  enable_visualizations: true
  figure_extraction: false
  max_paper_size_mb: 50
project_name: ASI-ARCH Research
seed: 42
training:
  batch_size: 32
  device: auto
  eval_steps: 100
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  max_grad_norm: 1.0
  max_steps: 2000
  mixed_precision: true
  save_steps: 500
  warmup_steps: 100
