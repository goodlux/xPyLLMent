[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpyllment"
version = "0.1.0"
description = "ASI-ARCH Research System - Autonomous AI Architecture Discovery"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ASI-ARCH Research Team", email = "research@asi-arch.ai"}
]
maintainers = [
    {name = "ASI-ARCH Research Team", email = "research@asi-arch.ai"}
]
keywords = [
    "artificial-intelligence", 
    "neural-architecture-search", 
    "evolutionary-algorithms",
    "transformer-architectures",
    "autonomous-research",
    "pixeltable",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    # Core ML/AI Framework
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    
    # Pixeltable Integration
    "pixeltable>=0.1.0",
    
    # LLM APIs
    "anthropic>=0.7.0",
    "openai>=1.0.0",
    
    # Data Management & Validation
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",  # PostgreSQL adapter
    "pymongo>=4.0.0",  # MongoDB support
    
    # Configuration & Logging
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    
    # CLI & UI
    "click>=8.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    
    # Scientific Computing
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    
    # Tensor Operations
    "einops>=0.6.0",
    
    # Async Support
    "asyncio-mqtt>=0.13.0",
    "aiofiles>=23.0.0",
    
    # Evolution & Optimization
    "deap>=1.3.0",  # Evolutionary algorithms
    "optuna>=3.0.0",  # Hyperparameter optimization
    
    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    
    # Testing & Development
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# GPU acceleration
gpu = [
    "torch[cuda]>=2.0.0",
    "nvidia-ml-py>=12.0.0",
]

# Advanced features
advanced = [
    "triton>=2.0.0",  # Custom kernels
    "flash-attn>=2.0.0",  # Flash attention
    "xformers>=0.0.20",  # Memory efficient transformers
]

# All extras
all = [
    "xpyllment[dev,gpu,advanced]"
]

[project.urls]
Homepage = "https://github.com/your-org/xpyllment"
Repository = "https://github.com/your-org/xpyllment.git"
Documentation = "https://xpyllment.readthedocs.io"
"Bug Tracker" = "https://github.com/your-org/xpyllment/issues"

[project.scripts]
xpyllment = "xpyllment.cli:main"
asi-arch = "xpyllment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xpyllment = ["*.yaml", "*.json", "configs/*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src/xpyllment"]
omit = ["tests/*", "src/xpyllment/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
