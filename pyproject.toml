[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpyllment"
version = "0.1.0"
description = "ASI-ARCH Research System - Autonomous AI Architecture Discovery"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ASI-ARCH Research Team", email = "research@asi-arch.ai"}
]
keywords = [
    "artificial-intelligence", 
    "neural-architecture-search", 
    "evolutionary-algorithms",
    "transformer-architectures",
    "autonomous-research",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    # Core ML/AI Framework (optional for CLI)
    # "torch>=2.0.0,<2.7.0",  # Will be installed when needed
    # "transformers>=4.30.0",  # Will be installed when needed
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    # Pixeltable (REQUIRED for the database layer)
    "pixeltable>=0.1.0",
    # LLM APIs
    "anthropic>=0.7.0",
    "openai>=1.0.0",
    # Data Management & Validation
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    # Configuration & Logging
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    # CLI & UI
    "click>=8.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    # Scientific Computing
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    # Tensor Operations
    "einops>=0.6.0",
    # Async Support
    "aiofiles>=23.0.0",
    # Evolution & Optimization
    "deap>=1.3.0",
    # ArXiv and PDF Processing
    "arxiv>=2.1.0",
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    # Basic Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "gliner>=0.2.21",
]

[project.optional-dependencies]
# Development dependencies (FIXED VERSION CONSTRAINTS)
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=5.0.0,<6.0.0",  # FIXED: Use older flake8 for compatibility
    "mypy>=1.0.0",
]

# Database extras
database = [
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.0.0",
]

# Visualization
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]

# Mac-safe minimal extras
basic = [
    "xpyllment[dev,database,viz]"
]

[project.urls]
Homepage = "https://github.com/your-org/xpyllment"
Repository = "https://github.com/your-org/xpyllment.git"

[project.scripts]
xpyllment = "xpyllment.interactive_cli:main"
asi-arch = "xpyllment.interactive_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
